version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: donation_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: donation_secret_password_2026
      POSTGRES_DB: donation_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - donation_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: donation_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:donation_secret_password_2026@postgres:5432/donation_erp_db?schema=public
      JWT_SECRET: super-secret-jwt-key-auto-donationist-2026
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - donation_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: donation_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - donation_net

  nginx:
    image: nginx:alpine
    container_name: donation_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - donation_net

volumes:
  postgres_data:

networks:
  donation_net:
    driver: bridge
